<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Inhalt bis unter Notch/Home-Indikator, Abstände über env(safe-area-inset-*) -->

      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="application-name" content="Super Sorter" />
    <meta name="format-detection" content="telephone=no" />
